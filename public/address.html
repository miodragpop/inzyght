<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address — Inzyght Ycash Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/datatables.net-bs5@1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        .balance-card { border-left: 4px solid #198754; }
        .addr-hash { word-break: break-all; font-family: monospace; font-size: 0.9rem; }
        .net-positive { color: #198754; font-weight: 600; }
        .net-negative { color: #dc3545; font-weight: 600; }
        .stat-label { font-size: 0.75rem; color: #6c757d; text-transform: uppercase; letter-spacing: .04em; }
        .stat-value { font-size: 1.1rem; font-weight: 600; }
    </style>
    <script src="/js/theme.js"></script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
    <div id="nav-placeholder" style="position:sticky;top:0;z-index:1030"></div>
    <script>
        fetch('/partials/header.html').then(r => r.text()).then(html => {
            document.getElementById('nav-placeholder').innerHTML = html;
            const _p = window.location.pathname;
            document.querySelectorAll('#main-nav .nav-link').forEach(function(a) {
                const _h = a.getAttribute('href');
                if (_h === _p || (_h !== '/' && _p.startsWith(_h))) a.classList.add('active');
            });
            if (window.syncThemeButton) syncThemeButton();
        });
    </script>

    <div class="container-fluid py-4">

        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-success" role="status"></div>
            <p class="mt-2 text-muted">Loading address...</p>
        </div>
        <div id="error-msg" class="alert alert-danger d-none"></div>

        <div id="addr-content" class="d-none">

            <!-- Title -->
            <div class="d-flex align-items-center mb-3">
                <h4 class="mb-0"><i class="fa fa-user-circle text-success"></i> Address</h4>
            </div>

            <!-- Address header card -->
            <div class="card border-0 shadow-sm mb-4 balance-card">
                <div class="card-body">
                    <div class="mb-2">
                        <small class="text-muted d-block">Address</small>
                        <span class="addr-hash" id="hdr-address"></span>
                        <button class="btn btn-sm btn-outline-secondary ms-2 py-0" onclick="copyAddress()" title="Copy address">
                            <i class="fa fa-copy"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-secondary ms-1 py-0" data-bs-toggle="modal" data-bs-target="#qrModal" title="Show QR code">
                            <i class="fa fa-qrcode"></i>
                        </button>
                    </div>
                    <div class="row g-3 mt-1">
                        <div class="col-md-3 col-6">
                            <div class="stat-label">Balance</div>
                            <div class="stat-value text-success" id="inf-balance">—</div>
                        </div>
                        <div class="col-md-3 col-6">
                            <div class="stat-label">Total Received</div>
                            <div class="stat-value" id="inf-received">—</div>
                        </div>
                        <div class="col-md-3 col-6">
                            <div class="stat-label">Total Sent</div>
                            <div class="stat-value" id="inf-sent">—</div>
                        </div>
                        <div class="col-md-3 col-6">
                            <div class="stat-label">Transactions</div>
                            <div class="stat-value" id="inf-txcount">—</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Mempool section (hidden when empty) -->
            <div id="mempool-section" class="d-none mb-4">
                <h6 class="text-warning mb-2"><i class="fa fa-clock-o"></i> Pending (Mempool)</h6>
                <div id="mempool-list"></div>
            </div>

            <!-- Transaction history -->
            <h6 class="mb-2 text-muted">Transaction History</h6>
            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <table id="tx-table" class="table table-hover table-sm mb-0" style="width:100%">
                        <thead class="table-light">
                            <tr>
                                <th>TXID</th>
                                <th>Block</th>
                                <th>Time</th>
                                <th class="text-end">Net Change</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
            <div id="load-more-wrap" class="text-center mt-3 d-none">
                <button id="load-more-btn" class="btn btn-outline-secondary btn-sm px-4" onclick="loadMore()">
                    Load older transactions
                </button>
            </div>

        </div>
    </div>

    <!-- QR code modal -->
    <div class="modal fade" id="qrModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered" style="max-width:320px">
            <div class="modal-content">
                <div class="modal-header py-2">
                    <h6 class="modal-title mb-0"><i class="fa fa-qrcode"></i> Address QR Code</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center py-4">
                    <div id="qr-canvas" class="d-inline-block mb-3"></div>
                    <div class="text-muted small font-monospace" id="qr-address" style="word-break:break-all;font-size:0.7rem"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net@1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net-bs5@1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="/js/address.js"></script>
</body>
</html>

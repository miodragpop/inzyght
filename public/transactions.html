<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Transactions — Inzyght Ycash Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/datatables.net-bs5@1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        .hash-cell { font-family: monospace; font-size: 0.8rem; }
    </style>
    <script src="/js/theme.js"></script>
    <script src="/js/node-status.js" defer></script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
    <div id="nav-placeholder" style="position:sticky;top:0;z-index:1030"></div>
    <script>
        fetch('/partials/header.html').then(r => r.text()).then(html => {
            document.getElementById('nav-placeholder').innerHTML = html;
            const _p = window.location.pathname;
            document.querySelectorAll('#main-nav .nav-link').forEach(function(a) {
                const _h = a.getAttribute('href');
                if (_h === _p || (_h !== '/' && _p.startsWith(_h))) a.classList.add('active');
            });
            if (window.syncThemeButton) syncThemeButton();
        });
    </script>

    <div class="container-fluid py-4">
        <div class="d-flex align-items-center mb-3">
            <h4 class="mb-0"><i class="fa fa-exchange text-success"></i> All Transactions</h4>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <table id="tx-table" class="table table-hover table-sm mb-0" style="width:100%">
                    <thead class="table-light">
                        <tr>
                            <th>TXID</th>
                            <th>Block</th>
                            <th>Time</th>
                            <th class="text-center">Type</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net@1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net-bs5@1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="/js/transactions.js"></script>
</body>
</html>

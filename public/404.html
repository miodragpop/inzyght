<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found — Inzyght</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <script src="/js/theme.js"></script>
    <script src="/js/node-status.js" defer></script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
    <div id="nav-placeholder" style="position:sticky;top:0;z-index:1030"></div>
    <script>
        fetch('/partials/header.html').then(r => r.text()).then(html => {
            document.getElementById('nav-placeholder').innerHTML = html;
            const _p = window.location.pathname;
            document.querySelectorAll('#main-nav .nav-link').forEach(function(a) {
                const _h = a.getAttribute('href');
                if (_h === _p || (_h !== '/' && _p.startsWith(_h))) a.classList.add('active');
            });
            if (window.syncThemeButton) syncThemeButton();
        });
    </script>

    <div class="container text-center py-5 mt-5">
        <div class="mb-4" style="font-size:5rem;line-height:1">
            <i class="fa fa-chain-broken text-secondary"></i>
        </div>
        <h1 class="fw-bold mb-2">404</h1>
        <p class="text-muted mb-4">The block, transaction, address or page you're looking for doesn't exist.</p>
        <div class="d-flex justify-content-center gap-2 flex-wrap">
            <a href="/" class="btn btn-success"><i class="fa fa-home"></i> Home</a>
            <a href="/blocks" class="btn btn-outline-secondary"><i class="fa fa-cube"></i> Blocks</a>
            <a href="/transactions" class="btn btn-outline-secondary"><i class="fa fa-exchange"></i> Transactions</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

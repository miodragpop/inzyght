<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction — Inzyght Ycash Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
    <style>
        .hash-word-break { word-break: break-all; font-family: monospace; }
        .io-row { font-size: 0.85rem; }
        .badge-sapling  { background-color: #0d6efd; }
        .badge-sprout   { background-color: #6f42c1; }
        .badge-coinbase { background-color: #ffc107; color: #000; }
    </style>
    <script src="/js/theme.js"></script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
    <div id="nav-placeholder" style="position:sticky;top:0;z-index:1030"></div>
    <script>
        fetch('/partials/header.html').then(r => r.text()).then(html => {
            document.getElementById('nav-placeholder').innerHTML = html;
            const _p = window.location.pathname;
            document.querySelectorAll('#main-nav .nav-link').forEach(function(a) {
                const _h = a.getAttribute('href');
                if (_h === _p || (_h !== '/' && _p.startsWith(_h))) a.classList.add('active');
            });
            if (window.syncThemeButton) syncThemeButton();
            document.querySelectorAll('#main-nav .nav-link').forEach(a => {
                if (a.getAttribute('href') === window.location.pathname) a.classList.add('active');
            });
        });
    </script>

    <div class="container-fluid py-4">

        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-success" role="status"></div>
            <p class="mt-2 text-muted">Loading transaction...</p>
        </div>
        <div id="error-msg" class="alert alert-danger d-none"></div>

        <!-- Off-chain (orphaned) tx notice. Shown when the tx is not on the main
             chain: either the node still has it with confirmations = -1, or it
             was removed by a reorg rollback and can no longer be displayed. -->
        <div id="orphan-notice" class="alert alert-warning d-none" role="alert">
            <i class="fa fa-triangle-exclamation me-1"></i>
            <strong>This transaction is not on the main chain.</strong>
            <span id="orphan-notice-detail"></span>
        </div>

        <div id="tx-content" class="d-none">

            <!-- Title -->
            <div class="d-flex align-items-center justify-content-between mb-3">
                <h4 class="mb-0">
                    <i class="fa fa-exchange text-success"></i> Transaction
                </h4>
                <button class="btn btn-sm btn-outline-secondary" id="raw-json-btn">
                    <i class="fa fa-code"></i> Raw JSON
                </button>
            </div>

            <!-- Header card -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-12">
                            <small class="text-muted d-block">TXID</small>
                            <span class="hash-word-break" id="hdr-txid"></span>
                            <button class="btn btn-sm btn-outline-secondary ms-2 py-0" onclick="copyTxid()"><i class="fa fa-copy"></i></button>
                        </div>
                        <div class="col-12" id="block-row">
                            <small class="text-muted d-block">Block</small>
                            <a id="inf-block" href="#" class="hash-word-break font-monospace"></a>
                        </div>
                        <div class="col-md-3 col-6">
                            <small class="text-muted d-block">Height</small>
                            <span id="inf-height">—</span>
                        </div>
                        <div class="col-md-3 col-6">
                            <small class="text-muted d-block">Timestamp</small>
                            <span id="inf-time">—</span>
                        </div>
                        <div class="col-md-3 col-6">
                            <small class="text-muted d-block">Confirmations</small>
                            <span id="inf-confirmations">—</span>
                        </div>
                        <div class="col-md-3 col-6">
                            <small class="text-muted d-block">Size</small>
                            <span id="inf-size">—</span>
                        </div>
                        <div class="col-md-3 col-6">
                            <small class="text-muted d-block">Version</small>
                            <span id="inf-version">—</span>
                        </div>
                        <div class="col-md-3 col-6">
                            <small class="text-muted d-block">Expiry Height</small>
                            <span id="inf-expiry">—</span>
                        </div>
                        <div class="col-md-3 col-6">
                            <small class="text-muted d-block">Fee</small>
                            <span id="inf-fee">—</span>
                        </div>
                        <div class="col-md-3 col-6" id="mempool-row">
                            <small class="text-muted d-block">Status</small>
                            <span class="badge bg-warning text-dark">Mempool</span>
                        </div>
                    </div>
                    <!-- Type badges -->
                    <div class="mt-3" id="type-badges"></div>
                </div>
            </div>

            <!-- Inputs / Outputs -->
            <div class="row g-4">
                <div class="col-md-6">
                    <h6 class="mb-2 text-muted" id="vin-heading">Inputs</h6>
                    <div id="vin-list"></div>
                </div>
                <div class="col-md-6">
                    <h6 class="mb-2 text-muted" id="vout-heading">Outputs</h6>
                    <div id="vout-list"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- Raw JSON modal -->
    <div class="modal fade" id="rawJsonModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content bg-dark text-light">
                <div class="modal-header border-secondary py-2">
                    <h6 class="modal-title mb-0"><i class="fa fa-code"></i> Raw getrawtransaction JSON</h6>
                    <div class="ms-auto d-flex gap-2">
                        <button class="btn btn-sm btn-outline-light" id="raw-copy-btn"><i class="fa fa-copy"></i> Copy</button>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                </div>
                <div class="modal-body p-0">
                    <div id="raw-json-loading" class="text-center py-4 text-muted">
                        <div class="spinner-border spinner-border-sm"></div> Loading...
                    </div>
                    <pre class="m-0 d-none" id="raw-json-pre" style="max-height:80vh;overflow:auto;white-space:pre-wrap;word-break:break-all"><code class="language-json" id="raw-json-code"></code></pre>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <script src="/js/transaction.js"></script>
</body>
</html>

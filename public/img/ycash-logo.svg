<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Orange circle background -->
  <circle cx="100" cy="100" r="100" fill="#F5A623"/>

  <!-- Main fist / palm with 3 curled fingers on top -->
  <rect x="50" y="85" width="100" height="72" rx="14" fill="white"
        transform="rotate(-15 100 121)"/>

  <!-- Three curled finger bumps across the top of the fist -->
  <rect x="58" y="68" width="28" height="38" rx="14" fill="white"
        transform="rotate(-15 72 87)"/>
  <rect x="86" y="62" width="28" height="40" rx="14" fill="white"
        transform="rotate(-15 100 82)"/>
  <rect x="114" y="66" width="28" height="38" rx="14" fill="white"
        transform="rotate(-15 128 85)"/>

  <!-- Thumb — lower-left, angled outward -->
  <rect x="22" y="115" width="32" height="62" rx="16" fill="white"
        transform="rotate(-42 38 146)"/>

  <!-- Pinky — upper-right, angled outward -->
  <rect x="142" y="44" width="32" height="62" rx="16" fill="white"
        transform="rotate(-15 158 75)"/>
</svg>
